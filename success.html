<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>결제 완료 | STYLE STORE</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="result">
  <div class="mark">✅</div>
  <h1>결제 인증이 완료되었어요</h1>
  <p class="sub">토스페이먼츠 결제창에서 인증이 정상 처리되었습니다.</p>
  <dl>
    <div><dt>주문번호</dt><dd id="orderId"></dd></div>
    <div><dt>결제 금액</dt><dd id="amount"></dd></div>
    <div><dt>paymentKey</dt><dd id="paymentKey"></dd></div>
  </dl>
  <a class="btn" href="index.html">쇼핑 계속하기</a>
  <p class="hint">※ 퍼블리싱 데모입니다. 실제 결제 승인은 서버에서 시크릿 키로 결제 승인 API(<code>POST /v1/payments/confirm</code>)를 호출해야 완료됩니다.</p>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('orderId').textContent = q.get('orderId') || '-';
  document.getElementById('amount').textContent = Number(q.get('amount') || 0).toLocaleString('ko-KR') + '원';
  document.getElementById('paymentKey').textContent = q.get('paymentKey') || '-';
</script>
</body></html>
