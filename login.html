<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 | STYLE STORE</title><meta name="robots" content="noindex, nofollow"><link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="auth">
  <a class="logo" href="index.html">STYLE STORE</a>
  <div class="tabs">
    <button type="button" class="active" data-mode="login">로그인</button>
    <button type="button" data-mode="signup">회원가입</button>
  </div>
  <form id="form" novalidate>
    <label id="nameRow" hidden>이름<input id="name" autocomplete="name" placeholder="홍길동"></label>
    <label>이메일<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
    <label>비밀번호<input id="password" type="password" autocomplete="current-password" placeholder="6자 이상" required></label>
    <p class="form-msg" id="msg" role="alert"></p>
    <button class="btn" id="submit" type="submit">로그인</button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body></html>
