<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 | STYLE STORE</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="auth">
  <a class="logo" href="index.html">STYLE STORE</a>
  <div class="tabs">
    <button type="button" class="active" data-mode="login">로그인</button>
    <button type="button" data-mode="signup">회원가입</button>
  </div>
  <form id="form" novalidate>
    <label id="nameRow" hidden>이름<input id="name" autocomplete="name" placeholder="홍길동"></label>
    <label>이메일<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
    <label>비밀번호<input id="password" type="password" autocomplete="current-password" placeholder="6자 이상" required></label>
    <p class="form-msg" id="msg" role="alert"></p>
    <button class="btn" id="submit" type="submit">로그인</button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
  let mode = 'login';
  const q = new URLSearchParams(location.search);
  // 같은 사이트의 페이지로만 돌아가게 제한합니다.
  const next = /^[\w-]+\.html$/.test(q.get('next') || '') ? q.get('next') : 'index.html';
  const $ = (id) => document.getElementById(id);

  document.querySelectorAll('.tabs button').forEach((b) =>
    b.addEventListener('click', () => {
      mode = b.dataset.mode;
      document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('active', x === b));
      $('nameRow').hidden = mode !== 'signup';
      $('password').autocomplete = mode === 'signup' ? 'new-password' : 'current-password';
      $('submit').textContent = mode === 'signup' ? '가입하기' : '로그인';
      $('msg').textContent = '';
    })
  );

  ready.then(() => { if (me) location.replace(next); });

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('email').value.trim();
    const password = $('password').value;
    const name = $('name').value.trim();
    const msg = $('msg');
    msg.textContent = '';
    if (!email || !password) return (msg.textContent = '이메일과 비밀번호를 입력해주세요.');
    if (mode === 'signup' && !name) return (msg.textContent = '이름을 입력해주세요.');
    $('submit').disabled = true;
    const { data, error } =
      mode === 'signup'
        ? await sb.auth.signUp({ email, password, options: { data: { name } } })
        : await sb.auth.signInWithPassword({ email, password });
    $('submit').disabled = false;
    if (error) {
      msg.textContent =
        error.message === 'Invalid login credentials' ? '이메일 또는 비밀번호가 올바르지 않아요.' : error.message;
      return;
    }
    if (!data.session) {
      msg.textContent = '가입 완료! 이메일로 보낸 인증 링크를 확인한 뒤 로그인해주세요.';
      return;
    }
    location.href = next;
  });
</script>
</body></html>
